[versions]
androidToolsBuild = "9.3.2"
androidToolsCommon = "32.3.2"
benManes = "0.61.0"
catalogUpdate = "1.1.1"
indramahkota = "1.10.4"
kaseChange = "1.4.1"
dependencyAnalysis = "3.19.1"
detekt = "2.0.0-alpha.6"
kotlin = "2.4.10"
ktfmt = "0.64"
spotless = "8.10.1"
kotlinpoet = "2.2.0"
kotlinxSerialization = "1.9.0"
ktor = "3.4.1"
secrets = "2.0.1"
xpp3 = "1.1.6"

[libraries]
android-tools-build = { module = "com.android.tools.build:gradle", version.ref = "androidToolsBuild" }
android-tools-common = { module = "com.android.tools:common", version.ref = "androidToolsCommon" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kase-change = { module = "net.pearx.kasechange:kasechange-jvm", version.ref = "kaseChange" }
dependency-analysis-gradle-plugin = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependencyAnalysis" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-json = { module = "io.ktor:ktor-client-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
sdk-common = { module = "com.android.tools:sdk-common", version.ref = "androidToolsCommon" }
secret-gradle-plugin = { module = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin", version.ref = "secrets" }
xpp3 = { module = "org.ogce:xpp3", version.ref = "xpp3" }

[bundles]
ktor-common = [
  "ktor-client-auth",
  "ktor-client-content-negotiation",
  "ktor-client-core",
  "ktor-client-json",
  "ktor-client-logging",
  "ktor-client-serialization",
  "ktor-serialization-kotlinx-json",
]

[plugins]
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "benManes" }
convention-commitlint = { id = "commitlint", version.ref = "indramahkota" }
convention-commitlint-config = { id = "commitlint.config", version.ref = "indramahkota" }
convention-publish-config = { id = "publish.config", version.ref = "indramahkota" }
convention-publishing = { id = "publish", version.ref = "indramahkota" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "catalogUpdate" }
